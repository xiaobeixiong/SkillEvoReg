job_name: continual_math_baseline_test
jobs_dir: benchmark/outputs/continualskillbench
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: true
  retry:
    max_retries: 0
environment:
  type: docker
  force_build: false
  delete: false
  override_memory_mb: 3072
agents:
- import_path: continual_holdout.stateless_agent:MathStatelessHeldout
  model_name: openai/gpt-5.4-mini
  override_setup_timeout_sec: 600
  kwargs:
    reasoning_effort: medium
    enable_judge_feedback: true
    judge_model: openai/gpt-5.4-mini
    judge_pass_threshold: 0.6
    enable_skill_probe: false
    compact_every_n: 1
    freeze_skill_updates: true
    frozen_library: benchmark/runtime/continualskillbench/frozen_libraries/baseline_step050
    prefer_skills: true
datasets:
- path: benchmark/runtime/continualskillbench/tasks
  task_names:
  - math-100-holdout50
