model:
  backend: openai_chat
  optimizer: gpt-5.4-mini
  target: gpt-5.4-mini
  optimizer_backend: openai_chat
  target_backend: openai_chat
  reasoning_effort: medium
  rewrite_reasoning_effort: medium
  rewrite_max_completion_tokens: 65536
  codex_exec_path: codex
  codex_exec_sandbox: workspace-write
  codex_exec_profile: ''
  codex_exec_full_auto: false
  codex_exec_reasoning_effort: none
  codex_exec_use_sdk: auto
  codex_exec_network_access: false
  codex_exec_web_search: false
  codex_exec_approval_policy: never
  claude_code_exec_path: claude
  claude_code_exec_profile: ''
  claude_code_exec_use_sdk: auto
  claude_code_exec_effort: medium
  claude_code_exec_max_thinking_tokens: 16384
  codex_trace_to_optimizer: true
  azure_openai_endpoint: ''
  azure_openai_api_version: 2024-12-01-preview
  azure_openai_api_key: ''
  azure_openai_auth_mode: openai_compatible
  azure_openai_ad_scope: https://cognitiveservices.azure.com/.default
  azure_openai_managed_identity_client_id: ''
  optimizer_azure_openai_endpoint: ''
  optimizer_azure_openai_api_version: 2024-12-01-preview
  optimizer_azure_openai_api_key: ''
  optimizer_azure_openai_auth_mode: ''
  optimizer_azure_openai_ad_scope: https://cognitiveservices.azure.com/.default
  optimizer_azure_openai_managed_identity_client_id: ''
  target_azure_openai_endpoint: ''
  target_azure_openai_api_version: 2024-12-01-preview
  target_azure_openai_api_key: ''
  target_azure_openai_auth_mode: ''
  target_azure_openai_ad_scope: https://cognitiveservices.azure.com/.default
  target_azure_openai_managed_identity_client_id: ''
  minimax_base_url: ''
  minimax_api_key: ''
  minimax_model: MiniMax-M2.7
  minimax_temperature: '0.7'
  minimax_max_tokens: '8000'
  minimax_enable_thinking: 'false'
  optimizer_minimax_base_url: ''
  target_minimax_base_url: ''
  optimizer_minimax_api_key: ''
  target_minimax_api_key: ''
train:
  num_epochs: 8
  train_size: 400
  batch_size: 40
  accumulation: 1
  seed: 101
  steps_per_epoch: 10
gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 32
  max_analyst_rounds: 3
  failure_only: false
optimizer:
  learning_rate: 4
  min_learning_rate: 2
  lr_scheduler: cosine
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: true
  slow_update_samples: 20
  slow_update_gate_with_selection: false
  longitudinal_pair_policy: mixed
  use_meta_skill: true
  use_skill_aware_reflection: false
  skill_aware_appendix_source: both
  skill_aware_consolidate_threshold: 0
evaluation:
  use_gate: true
  sel_env_num: 0
  paired_selection_repeats: 2
  test_env_num: 0
  eval_test: false
  gate_metric: hard
  epoch_end_eval_script: benchmark/scripts/evaluate_skillopt_checkpoints.py
  epoch_end_eval_retries: 3
regularization:
  enabled: false
  segmenter: llm
  segmenter_retries: 2
  token_scale: 100
  atom_cost: 0.2
  enable_code_complexity: true
  lambda_complex: 0.1
  complexity_free_growth: 0.1
  dropout_enabled: true
  dropout_probability: 0.1
  dropout_max_atoms: 1
  ccv_enabled: true
  ccv_required: false
  ccv_source_split: valid_seen
  ccv_source_size: 4
  ccv_max_patterns: 3
  ccv_attacks_per_pattern: 2
  ccv_max_attacks: 6
  ccv_history_items: 12
  ccv_attacker_model: ''
  ccv_reasoning_effort: medium
  ccv_builder_reasoning_effort: low
  ccv_max_completion_tokens: 12000
  ccv_timeout: 300
  ccv_retries: 3
  tau_adv: 0.0
env:
  name: searchqa
  skill_init: benchmark/third_party/SkillOpt/skillopt/envs/searchqa/skills/initial.md
  split_mode: split_dir
  split_seed: 42
  split_dir: benchmark/third_party/SkillOpt/data/searchqa_split
  data_path: ''
  split_output_dir: ''
  exec_timeout: 180
  out_root: benchmark/outputs/skillopt/searchqa/baseline/train
  max_turns: 1
  max_completion_tokens: 16384
  workers: 32
  limit: 0
