version: 1
scoring_note: >
  `tests/test.sh` computes reward from deterministic outcome and process tests.
criteria:
  - name: outcome_correctness
    weight: 0.45
    description: Final JSON output matches expected priorities, reply selections, draft content, and ordering.
  - name: process_alignment
    weight: 0.25
    description: Solution updates the provided pipeline/policy modules rather than pre-writing a static final output.
  - name: context_use
    weight: 0.20
    description: Uses mailbox, org chart, calendar, thread history, cc, and stakeholder context where relevant.
  - name: output_contract
    weight: 0.10
    description: Output is valid JSON with structured reasons, summaries, and draft metadata.
family_focus: "draft context-aware replies that answer the actual request, respect history and cc politics, and avoid over-commitment."
