openapi: "3.0.3"
info:
  title: Order API
  version: "1.0.0"
  description: API for managing orders

paths:
  /api/orders:
    get:
      summary: List all orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /api/orders/{orderId}:
    get:
      summary: Get a single order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          example: "ORD-1001"
        customer:
          type: string
          example: "Alice"
        items_count:
          type: integer
          example: 7
        unit_price:
          type: number
          format: float
          example: 7.14
        total_amount:
          type: string
          format: decimal
          description: "Decimal-precise total amount"
          example: "49.99"
