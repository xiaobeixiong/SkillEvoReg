[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "package-alpha"
version = "1.2.0"
requires-python = ">=3.10"
dependencies = ["package-core>=1.9,<2.0"]
[tool.setuptools.packages.find]
where = ["."]
include = ["package_alpha", "package_alpha.*"]
