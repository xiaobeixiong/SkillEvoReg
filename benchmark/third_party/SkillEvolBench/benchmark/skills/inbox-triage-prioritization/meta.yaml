gap_1_summary: 'Implicit urgency signals: the curated skill only fires on explicit markers (''URGENT'', ''ASAP''). The high-priority emails are often calm in tone but carry implicit urgency — ''Board meeting tomorrow and I still don''t have slides'' has no urgency keyword but is a P0. Look for time references, blocking-language, and consequence framing, not just keywords.'
gap_2_summary: 'Sender-hierarchy weighting: the curated skill ignores who sent the email. A casual note from the CEO often outranks an all-caps demand from an intern. Maintain a relationship graph (your boss, your boss''s boss, customers, vendors) and combine it with content urgency for the final score.'
