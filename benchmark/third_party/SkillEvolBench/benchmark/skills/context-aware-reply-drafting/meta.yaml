gap_1_summary: 'Conversation history beyond the latest message: the curated skill only reads the message you''re replying to. Multi-turn threads carry context — earlier promises, recent decisions, parties added or removed — that should shape the reply. Read the last 3-5 messages and let the historical context inform tone, references, and what you commit to.'
gap_2_summary: 'Multi-stakeholder balancing on cc: the curated skill ignores the cc list. When a reply goes to your direct counterpart but cc''s their manager, your manager, and the customer, the wording must serve all four readers — informative for the counterpart, professional for the managers, and reassuring for the customer. Check who''s reading before you write.'
