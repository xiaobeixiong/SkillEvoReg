gap_1_summary: 'Implicit commitments, not just explicit promises: the curated skill tracks ''I will...'' phrasings. The harder commitments are ''Let me look into that'', ''Will get back to you'', ''I''ll think about it'' — they sound noncommittal but the sender does expect a follow-up. Treat soft commitments as trackable too, with a longer default deadline.'
gap_2_summary: 'Deadline expiration, not just message age: the curated skill reports ''last reply was 5 days ago''. The interesting case is ''commit-by date was Friday and it''s now Monday'' — the action item was on a clock, the clock has expired, and the sender is waiting. Parse explicit dates from the original commitment and flag overdue items separately from stale threads.'
