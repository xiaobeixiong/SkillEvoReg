gap_1_summary: 'Statistical-misdirection detection: the curated skill quotes numbers verbatim. ''Grew 300%'' could be 1 → 4 — a small-base effect that doesn''t justify the framing. Surface the absolute numbers alongside the percentages, and flag claims where the base is suspiciously small.'
gap_2_summary: 'Missing dimensions vs zero: the curated skill builds a comparison table and may treat a missing value as zero. If A has data on `cost` but B doesn''t, B''s row should say ''no data'', not ''0'' — otherwise the recommendation can flip on a phantom advantage. Distinguish absent from zero in every cell.'
