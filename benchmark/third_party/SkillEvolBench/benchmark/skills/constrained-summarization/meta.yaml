gap_1_summary: 'Information priority within the budget: the curated skill truncates by paragraph order. A summary should keep the highest-importance points and drop the rest, even if that means skipping the introduction. Score each candidate point, then fill the summary greedily from highest priority down.'
gap_2_summary: 'Multi-audience tailoring: the curated skill produces one summary. The same document needs different framings for executives (impact + numbers), engineers (architecture + tradeoffs), and customers (benefits + actions). Identify the audience first, then choose what to emphasize and what to drop.'
