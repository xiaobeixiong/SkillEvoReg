gap_1_summary: 'Daylight Saving Time: the curated skill uses fixed UTC offsets. Across the DST boundary, the offset shifts by an hour and a meeting that was 9am EST becomes 9am EDT but at a different UTC time. Use timezone-aware libraries (`zoneinfo`, `pytz`) instead of fixed offsets, and re-resolve every recurring meeting after a DST transition.'
gap_2_summary: 'Soft-constraint optimization: the curated skill only handles hard constraints (busy / available). Real preferences are soft — ''morning is better'', ''no Fridays after 3pm'', ''avoid the day before a deadline'' — and a good scheduler picks the best feasible time, not just any feasible time. Score candidate slots against the soft constraints and return the highest-scoring valid one.'
