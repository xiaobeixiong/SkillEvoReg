gap_1_summary: 'Boundary-behavior preservation: the curated skill doesn''t stress that every function''s behavior on edge inputs (None, empty collections, zero, very large values) must be byte-identical after the refactor. The most common refactoring regression is a ''cleaner'' implementation that handles the happy path beautifully and silently changes one edge case.'
gap_2_summary: 'Type-system constraints: the curated skill is Python-only and assumes dynamic typing. TypeScript or typed-Python refactors carry compile-time constraints that drive the refactor — `super()` chain ordering, generics that propagate through method signatures, and discriminated unions that stop type-checking when a class moves.'
