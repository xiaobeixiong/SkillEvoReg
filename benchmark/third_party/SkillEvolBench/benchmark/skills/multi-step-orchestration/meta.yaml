gap_1_summary: 'Conditional branches: the curated skill teaches linear A→B→C pipelines. Real workflows have decision points: Step 2''s result determines whether Step 3 calls X or Y, with different downstream chains. Model the pipeline as a directed graph with explicit branch conditions, not as a single sequence.'
gap_2_summary: 'Asynchronous polling: the curated skill only handles synchronous chains. The ''POST creates a task → poll status until done → GET the final result'' pattern is everywhere in modern APIs. Build poll loops with timeout, backoff, and a clear terminal condition; never block forever.'
