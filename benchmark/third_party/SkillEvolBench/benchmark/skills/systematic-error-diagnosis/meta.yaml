gap_1_summary: 'Silent behavioral bugs: the curated skill''s workflow starts from a traceback, but programs that run to completion with the wrong output give it nothing to anchor on. Treat ''no crash but wrong result'' as a first-class case — build an expected-behavior model, then diff it against actual output.'
gap_2_summary: 'Silent async failures: the curated skill only mentions forgetting `await`, but real async bugs often look fine. `Promise.allSettled` rejected entries get filtered out unnoticed, EventEmitter `error` events without listeners crash the process days later, and unhandled rejections vanish from the main flow. Audit every async branch for swallowed errors.'
