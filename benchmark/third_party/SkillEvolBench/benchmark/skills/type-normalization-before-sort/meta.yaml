gap_1_summary: 'Locale-aware ordering: the curated skill uses Python''s default sort, which orders Unicode by codepoint. That''s wrong for German (where `ä = ae`), Chinese (which sorts by stroke count or pinyin depending on context), and any language with collation rules. When sorting user-facing strings, use a locale-aware collator (`locale.strcoll`, `pyicu`).'
gap_2_summary: 'Stable secondary keys: the curated skill only teaches single-key sorting. With multi-key sorts, the stability of secondary keys matters — sorting by `priority` then by `created_at` gives different results from a single sort with a tuple key when there are ties on priority. Use stable sorts and chain in reverse priority order, or pass a single composite key.'
