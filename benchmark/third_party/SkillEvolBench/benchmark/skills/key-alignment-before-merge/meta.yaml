gap_1_summary: 'Fuzzy key matching: the curated skill only handles exact key matches. Real datasets contain near-duplicates — `New York` / `NY` / `New York City` / `new york` all refer to the same entity. Use a normalization step (canonical-form lookup or fuzzy string matching with a similarity threshold) before joining.'
gap_2_summary: 'M:N fan-out control: the curated skill doesn''t distinguish 1:1 / 1:N / M:N joins. An accidental M:N merge can silently inflate row counts (1000 → 50000) and skew every downstream aggregation. Verify cardinality before the merge (`df.duplicated(subset=key).sum()`) and assert the expected row-count change after.'
