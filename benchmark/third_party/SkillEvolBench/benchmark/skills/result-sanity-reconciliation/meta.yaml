gap_1_summary: 'Statistical anomaly detection: the curated skill only checks empty / non-empty. A column whose normal range is 100-200 with one row at 20,000 should ring an alarm — but row count and null count don''t catch it. Add basic distribution checks (min, max, mean, std) and flag values more than five standard deviations off.'
gap_2_summary: 'Cross-query consistency: the curated skill verifies one query at a time. The bug surfaces when query A''s `SUM(amount)` and query B''s `SUM(amount)` over the same business definition return different numbers — both look reasonable in isolation. Express invariants that span queries (totals match across breakdowns) and assert them as part of the pipeline.'
