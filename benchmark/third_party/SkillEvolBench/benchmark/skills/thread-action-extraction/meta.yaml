gap_1_summary: 'Question vs action distinction: the curated skill treats every interrogative as an action item. Rhetorical questions (''Doesn''t that seem high?'') and confirmation questions (''Does Friday work?'') aren''t action items. Filter on whether the asker actually expects a deliverable or just a yes / no acknowledgment.'
gap_2_summary: 'Implicit delegation: the curated skill only catches ''@name, please do X''. Real delegation is often softer — ''It would be great if design could look into this'', ''Maybe we should ask infra''. These are real assignments that need to be tracked, even though no name is tagged. Resolve the implied owner from team context.'
