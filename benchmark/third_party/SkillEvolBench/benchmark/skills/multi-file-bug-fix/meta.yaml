gap_1_summary: 'Naming-convention drift across boundaries: the curated skill doesn''t address what happens when one half of the system uses camelCase and the other uses snake_case for the same field. The data silently drops at the boundary; both sides ''work'' in isolation. Fix by aligning the convention end-to-end, not by case-converting on the fly.'
gap_2_summary: 'Numeric precision across serializations: the curated skill ignores Decimal → float → JSON round-tripping. A Python `Decimal(''1.10'')` becomes `1.1` in float, then `1.1` in JSON, and your invoice total is one cent off. Treat serialization boundaries as lossy and assert precision invariants explicitly.'
