gap_1_summary: 'Inferred fills, not just exact matches: the curated skill only does literal lookup. The template asks for `total_budget` but the source has line items that need to be summed. Treat fills as a small computation: locate the relevant context, then derive the answer (sum, max, latest, count) before inserting.'
gap_2_summary: 'Multi-source conflicts: the curated skill assumes each field has one source. When two source documents disagree on the same field, you cannot silently pick one. Detect conflicts, surface both values with their sources, and require a resolution rule.'
