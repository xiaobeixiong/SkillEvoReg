gap_1_summary: 'npm peer dependencies: the curated skill covers pip''s direct conflicts only. npm''s peer-dep model, ERESOLVE errors, and the `--force` trap (which ''fixes'' the install but leaves a runtime time bomb) need a separate playbook. Resolve peer deps by aligning shared frameworks, not by silencing the resolver.'
gap_2_summary: 'Monorepo cross-package coordination: the curated skill assumes a single `requirements.txt`. In a monorepo workspace, packages share dependencies through the workspace root and a fix in one package can break a sibling. Treat the whole workspace as a single resolution unit.'
