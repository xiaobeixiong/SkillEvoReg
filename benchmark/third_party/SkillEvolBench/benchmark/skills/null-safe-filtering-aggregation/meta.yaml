gap_1_summary: 'groupby silently drops NaN keys: the curated skill teaches `dropna()` and `fillna(0)`. The trap is `df.groupby(''region'').sum()` — pandas drops rows where `region` is NaN by default, so an entire group of records vanishes from the report. Pass `dropna=False` or check `df[''region''].isna().sum()` before grouping.'
gap_2_summary: 'Sentinel values that aren''t NaN: the curated skill only handles NaN / None. Datasets often encode missingness with `-1`, `0`, `9999`, or string sentinels like `''N/A''` / `''unknown''`. These are valid values to pandas but logically missing — you have to know the schema''s convention and replace them explicitly before computing means or sums.'
