gap_1_summary: 'Cross-parameter constraints: the curated skill validates each parameter in isolation. The interesting bugs come from constraints that span multiple parameters — `start_date <= end_date` (with timezone-aware comparison), `quantity * unit_price <= max_total`, mutually exclusive flags. Validate the parameter set, not just each parameter.'
gap_2_summary: 'Partial-rejection in batches: the curated skill is all-or-nothing. When 6 of 10 items in a batch are invalid, the right behavior is to accept the 4 valid ones, reject the 6 with per-item reasons, and return both lists — not to fail the entire request. Design batch validators that report per-item verdicts.'
