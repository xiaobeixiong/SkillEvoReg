gap_1_summary: 'Nested wrapper structure changes: the curated skill validates only the top-level envelope. APIs sometimes wrap their payloads more deeply between versions — a response that was `{data: [...]}` becomes `{result: {items: [...]}}` and your top-level check still passes while the parser that follows it returns nothing. Validate the full path you actually depend on, not just the outer key.'
gap_2_summary: 'Semantic anomalies in valid structures: the curated skill only checks shape. A response with `price: -50` is structurally valid but semantically nonsense. After structural validation passes, run business-rule checks on the values themselves before trusting them.'
