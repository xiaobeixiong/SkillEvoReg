gap_1_summary: 'Citation content mismatch, not just citation existence: the curated skill verifies the cited source is real. The interesting failure is a real source whose claim doesn''t match what the citing paper says it does — the source exists, the URL works, but the cited statement is paraphrased into something the source never claimed. Read the cited passage and check it against the citing claim.'
gap_2_summary: 'Selective quoting that omits caveats: the curated skill verifies a quoted passage exists in the source. A quote can be technically present but stripped of its original caveats — ''X works'' was originally ''X works, but only when Y holds''. Read the surrounding context for limitations the citing paper dropped.'
