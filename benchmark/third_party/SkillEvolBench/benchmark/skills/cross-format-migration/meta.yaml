gap_1_summary: 'Information-loss detection: the curated skill converts without reporting what it threw away. Going DOCX → Markdown loses merged-cell tables, footnote anchors, and embedded images. Build a ''lossy fields'' report alongside the converted output so the user knows what to verify manually.'
gap_2_summary: 'Round-trip consistency: the curated skill doesn''t verify A → B → A round-trips losslessly. The only way to know your converter preserves content is to convert back and diff. Run a round-trip test on the result before declaring the migration done.'
