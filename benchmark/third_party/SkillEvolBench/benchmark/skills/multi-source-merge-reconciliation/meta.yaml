gap_1_summary: 'Fuzzy entity matching across sources: the curated skill uses exact key match. Bob / Robert / Bobby / Mr. Robertson are the same person; CRM records use ''Bob R.'' and the HR system uses ''Robert L. Robinson''. Match on a normalized canonical form with a confidence threshold, and surface low-confidence merges for review.'
gap_2_summary: 'Nested-field conflicts: the curated skill only compares top-level fields. Two sources may agree on `name` and `email` but disagree on `address.street_number` — that conflict is buried inside a sub-object. Walk the full structure and report conflicts at any depth, not just at the root.'
