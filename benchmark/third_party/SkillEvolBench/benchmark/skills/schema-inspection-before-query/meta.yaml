gap_1_summary: 'Invisible-character / encoding traps: the curated skill checks column names by spelling. Real-world CSVs hide BOM bytes (U+FEFF), zero-width spaces (ZWSP, U+200B), and Latin-1 vs UTF-8 mismatches that make `df.columns == ''price''` fail silently. Always inspect column names with `repr()` and check the file''s actual encoding before trusting the schema.'
gap_2_summary: 'Mixed-type columns: the curated skill assumes one type per column. A single column may contain `int`, `str`, and `float` values mixed together — `sum()` then crashes with a TypeError or, worse, silently coerces and produces wrong results. Inspect each column''s `dtype` and `value_counts(type)` before any aggregation.'
