gap_1_summary: 'Cursor-based pagination and variable page size: the curated skill covers offset / page-number paging only. Cursor-based APIs return an opaque `next_cursor` that must be threaded through, and some APIs change page size based on response weight (small items → larger pages). Drive the loop off the API''s continuation token, not off a counter you maintain.'
gap_2_summary: 'Concurrent writes during pagination: the curated skill assumes the dataset is frozen for the duration of the fetch. When records are inserted or deleted while you paginate, an offset-based loop will skip rows or duplicate them. Snapshot the result with a stable sort plus a pinning timestamp, or detect and recover from drift between pages.'
