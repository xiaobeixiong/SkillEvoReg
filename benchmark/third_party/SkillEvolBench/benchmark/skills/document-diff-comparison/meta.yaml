gap_1_summary: 'Semantic equivalence: the curated skill does line-by-line text diff. ''Increase by 10%'' and ''from 100 to 110'' are semantically equivalent but textually different — the curated skill flags them as a change. Run a semantic-equivalence pass for numeric expressions, dates, and synonyms before reporting differences.'
gap_2_summary: 'Structural reorganization vs content change: the curated skill doesn''t distinguish ''sections were renumbered'' from ''sections were edited''. A reorganized document looks like every section changed under naive line diff. Detect reorganization (matching paragraphs by content, not position) and report structure-only edits separately from content edits.'
