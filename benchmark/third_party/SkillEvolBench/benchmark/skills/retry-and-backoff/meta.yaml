gap_1_summary: 'Status-code-specific retry strategy: the curated skill retries 5xx three times with a fixed delay. Real APIs require honoring `Retry-After` headers (which can be a date or a duration), exponential backoff with jitter (to avoid synchronized retry storms), and a circuit breaker that gives up cleanly after sustained failure. Tune the retry policy per status code, not per HTTP family.'
gap_2_summary: 'Idempotent vs non-idempotent retries: the curated skill retries every request the same way. A retried POST can create a duplicate resource if the original request actually succeeded but the response was lost in transit. For non-idempotent operations, send an idempotency key and only retry when the server confirms it''s safe — otherwise treat the request as terminal.'
