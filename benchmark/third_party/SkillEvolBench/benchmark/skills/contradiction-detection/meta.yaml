gap_1_summary: 'Implicit contradictions across timelines: the curated skill only detects ''A is X'' vs ''A is not X''. Timeline contradictions are subtler — Document 1 says event happened in 2020, Document 2 says it followed a 2021 event, and the only contradiction is the implied ordering. Build a fact-and-time graph and check for cycles or impossible orderings.'
gap_2_summary: 'Internal contradictions within one document: the curated skill only compares across sources. A single document''s abstract may state one number and the methods section another, or a paper''s conclusion may contradict its own data. Run the contradiction check within each document, not just between.'
