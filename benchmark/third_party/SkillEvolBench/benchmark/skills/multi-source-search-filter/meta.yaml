gap_1_summary: 'Evidence vs opinion weighting: the curated skill treats all sources as equivalent. ''I believe X'' from a blog post and ''an RCT of 5000 patients showed X'' deserve very different weights. Capture the type of source (peer-reviewed, primary, secondary, opinion, marketing) and weight relevance scores accordingly.'
gap_2_summary: 'Source recency in fast-moving fields: the curated skill ranks by citation count or institutional authority. In rapidly evolving areas (LLMs, ML benchmarks), a 2024 preprint with 10 citations may be more relevant than a 2018 paper with 1000. Combine recency and citation in a single score, with field-specific decay rates.'
