gap_1_summary: 'Semantic conflicts without markers: the curated skill only handles textual conflicts that git already flagged. The dangerous case is a clean auto-merge where two branches changed unrelated lines that now interact incorrectly — both sides compile, neither side conflicts, but the combined behavior is wrong. Always run the test suite after a merge, even when there were no conflict markers.'
gap_2_summary: 'Format-sensitive config files: the curated skill assumes `.py` / `.js` source files where line-based merge is reliable. YAML and JSON depend on indentation and brace structure; a textual merge can produce syntactically invalid output that no longer parses. Merge structured config by parsing into a tree, merging at the key level, then re-emitting.'
