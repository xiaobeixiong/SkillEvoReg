gap_1_summary: 'Conditional and nested fields: the curated skill only does flat key-value extraction. Real invoices have conditional discounts (''apply only if subtotal > 1000''), nested line items, and tables that span pages. Build the schema as a tree, not a dictionary, and capture conditional logic as part of the field definition.'
gap_2_summary: 'Multi-currency / multi-unit values: the curated skill assumes one currency or unit per document. Real-world docs mix USD / EUR / JPY, or grams / pounds / pieces, sometimes in adjacent fields. Capture each value with its unit attached and reject extractions that lose the unit metadata.'
