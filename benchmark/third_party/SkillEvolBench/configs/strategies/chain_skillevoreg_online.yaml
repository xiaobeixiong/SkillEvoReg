name: chain_skillevoreg_online
n_candidates: 1
candidate_modes: ["free_form"]

author_model: openai/gpt-5.4-mini
author_temperature: 0.2
author_max_tokens: 16384

# Paired initialization: skip current-run T1 and preload the exact
# baseline-derived post-T1 skill, outcome, and compacted trajectory before T2.
shared_t1_anchor_manifest: null
shared_t1_anchor_required: false
shared_t1_skip_execution: false

# Keep SkillEvolBench's original one-candidate, always-apply chain semantics.
# SkillEvoReg changes proposal formation and supplies later feedback only.
regularization_proposal_regularization: true

# Fixed proposal regularisation for every revision. T1 self-generation starts
# from an empty library, so these revision-only settings are naturally N/A.
regularization_complexity_lambda: 0.15
regularization_free_growth: 0.10

# Detect complexity anomalies after proposal generation. The anchor is the
# post-T1 family skill, so T2/T3 share one cumulative 15% budget. In deferred
# mode, a violation becomes feedback for the next normal revision.
regularization_hard_complexity_enabled: true
regularization_hard_max_relative_growth: 0.15
regularization_hard_max_atom_growth: 4

regularization_dropout_enabled: true
regularization_dropout_probability: 0.05
regularization_dropout_max_atoms: 4
regularization_dropout_min_eligible_atoms: 4
regularization_dropout_ensure_at_least_one: true

# Candidate-conditioned differential probing. T1 has no meaningful previous
# skill, so probe T2/T3 only. Complexity/CCV anomalies are bundled and fed to
# the next normal revision exactly once; dropout stays training-time only.
regularization_ccv_enabled: true
regularization_ccv_roles: ["enriched", "variant"]
regularization_ccv_max_appendix_chars: 1600
regularization_ccv_generation_retries: 2
regularization_ccv_deterministic_fallback: false
regularization_ccv_min_old_score: 0.80
regularization_ccv_min_regression_drop: 0.05
regularization_consumption_mode: deferred
