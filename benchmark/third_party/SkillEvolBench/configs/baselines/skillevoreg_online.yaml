# SkillEvoReg as a training-time regularisation plugin for SkillEvolBench.
# It preserves the paper baseline's update semantics: every valid T1-T3 patch
# is applied directly. CCV is diagnostic/feedback-only and never rejects or
# rolls back an update.
name: skillevoreg_online
description: Self-generated skills with complexity, atomic-dropout, and feedback-only CCV regularisation.
track: path-a

skill_init: empty
allow_self_gen_induction: true
allow_zero_shot_creation: false
allow_curated_inject: false

allow_revision: true
allow_retirement: false
allow_quarantine: false
allow_applicability_narrow: false
allow_rollback: false

use_skill_library: true
skill_retrieval_k: 8
library_scope: environment
retrieval_phase_aware: true
enforce_same_family_target: true

feedback_level: process
feedback_to_skill_text: true

default_strategy: chain_skillevoreg_online
revision_trigger: always
max_revisions_per_skill: 5

# Preserve the paper's final frozen-library replay measurement. Diagnostic
# CCV trials are tagged separately and excluded from LSR/RSR/ESR.
within_env_replay: true
replay_eval: false

harbor_agent_name: codex
model_name: openai/gpt-5.4-mini
