# Frozen-evaluation preset matching the completed SkillEvolBench main runs.
# Keep this separate from the current high-effort preset: repeat evaluations
# must use the same task-agent and retriever reasoning effort as repeat 1.

name: gpt-5.4-mini-yibu-medium
short_id: gpt-5-4-mini-yibu-medium
provider: openai_compatible
harbor_agent_name: codex
agent_model_name: openai/gpt-5.4-mini
agent_reasoning_effort: medium
required_env: [YIBU_API_BASE, YIBU_API_KEY]

agent_env:
  OPENAI_BASE_URL: "${YIBU_API_BASE}"
  OPENAI_API_KEY: "${YIBU_API_KEY}"
  CODEX_MODEL_PROVIDER: yibu
  CODEX_PROVIDER_ENV_KEY: OPENAI_API_KEY
  CODEX_WIRE_API: responses
  CODEX_MODEL_VERBOSITY: medium

host_litellm:
  model: openai/gpt-5.4-mini
  reasoning_effort: medium
  api_base_env: YIBU_API_BASE
  api_key_env: YIBU_API_KEY
