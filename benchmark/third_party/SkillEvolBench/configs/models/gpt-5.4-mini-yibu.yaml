# Local experiment preset: GPT-5.4 Mini via Codex CLI and the project's
# OpenAI-compatible Yibu endpoint. Credentials are injected at runtime from
# dedicated YIBU_* variables and are never stored in this file. This avoids
# accidental dependence on CC Switch or an unrelated Azure preset.

name: gpt-5.4-mini-yibu
short_id: gpt-5-4-mini-yibu
provider: openai_compatible
harbor_agent_name: codex
agent_model_name: openai/gpt-5.4-mini
agent_reasoning_effort: high
required_env: [YIBU_API_BASE, YIBU_API_KEY]

agent_env:
  OPENAI_BASE_URL: "${YIBU_API_BASE}"
  OPENAI_API_KEY: "${YIBU_API_KEY}"
  CODEX_MODEL_PROVIDER: yibu
  CODEX_PROVIDER_ENV_KEY: OPENAI_API_KEY
  CODEX_WIRE_API: responses
  CODEX_MODEL_VERBOSITY: medium

# SkillAuthor and other host-side LLM calls use the same model and endpoint.
host_litellm:
  model: openai/gpt-5.4-mini
  reasoning_effort: high
  api_base_env: YIBU_API_BASE
  api_key_env: YIBU_API_KEY
